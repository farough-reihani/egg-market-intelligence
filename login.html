<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173b32">
  <title>ورود و ثبت‌نام | هوش بازار تخم‌مرغ</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .auth-wrap{max-width:460px;margin:48px auto;padding:0 16px}
    .auth-card{background:#fff;border:1px solid #e3ebe5;border-radius:18px;padding:26px}
    .auth-card h1{font-size:22px;margin:0 0 8px}
    .auth-card>p{color:#718078;font-size:13px;line-height:2}
    .auth-tabs{display:flex;gap:8px;margin:20px 0}
    .auth-tabs button{flex:1}
    .auth-tabs button.active{background:#1c654c;color:#fff}
    #authForm{display:grid;gap:14px}
    #authForm label{display:grid;gap:7px;font-size:12px}
    #authSubmit{background:#1c654c;color:white}
    #authMessage{font-size:12px;line-height:1.9;color:#26734f}
    #authMessage[data-error="true"]{color:#b33}
    .back-link{display:inline-block;margin-top:16px;color:#1c654c;font-size:12px}
  </style>
</head>
<body>
  <header><b class="egg">🥚</b><div><strong>هوش بازار تخم‌مرغ</strong><small>ورود امن اعضا</small></div></header>
  <main class="auth-wrap">
    <section class="auth-card">
      <h1>ورود به سامانه</h1>
      <p>برای دسترسی به داشبورد و اطلاعات حساب خود وارد شوید یا حساب جدید بسازید.</p>
      <div class="auth-tabs">
        <button type="button" class="active" data-auth-mode="signin">ورود</button>
        <button type="button" data-auth-mode="signup">ثبت‌نام</button>
      </div>
      <form id="authForm">
        <label id="displayNameField" hidden>نام نمایشی<input id="displayName" autocomplete="name" placeholder="نام شما"></label>
        <label>ایمیل<input id="email" type="email" autocomplete="email" required placeholder="name@example.com"></label>
        <label>گذرواژه<input id="password" type="password" autocomplete="current-password" minlength="8" required placeholder="حداقل ۸ کاراکتر"></label>
        <button id="authSubmit" type="submit">ورود به حساب</button>
        <output id="authMessage" aria-live="polite"></output>
      </form>
      <a class="back-link" href="index.html">بازگشت به صفحه عمومی بازار</a>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
</body>
</html>
